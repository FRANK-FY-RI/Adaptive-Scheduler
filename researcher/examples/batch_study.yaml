# The study batch: five workload conditions x four strategies x three seeds, 16 CPU cores.
# adaptive's parameters are its defaults at the pinned team commit, written out so every
# summary records them. easy_backfill is the control for adaptive: same backfilling rule,
# arrival order instead of utility ranking.
cluster_cores: 16
workloads:
  - synth:light:n=300:seed=7
  - synth:heavy:n=300:seed=7
  - synth:short_heavy:n=300:seed=7
  - synth:mixed:n=300:seed=7
  - synth:wide_jobs:n=300:seed=7
strategies: [fifo, sjf, adaptive, easy_backfill]
strategy_params:
  adaptive: {base_wait_weight: 0.35, base_short_weight: 0.45, base_pack_weight: 0.20,
             adaptation_gain: 0.50, enable_backfill: true}
repeats: {seeds: [7, 11, 13]}
output_dir: results/
