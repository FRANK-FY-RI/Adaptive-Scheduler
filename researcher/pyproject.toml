[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptivesched"
version = "0.1.0"
description = "AdaptiveSched researcher part: compare scheduling strategies on one simulated cluster"
requires-python = ">=3.10"
dependencies = [
    "numpy", "pandas", "matplotlib", "pyyaml",
    # the engine + policies package one directory up (this repo's root): `pip install -e .` there first.
    # Summaries record its exact commit (and "+dirty" for uncommitted engine edits) as engine_version.
    "adaptive-scheduler",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
adaptivesched = "adaptivesched.cli:main"

[tool.setuptools.packages.find]
include = ["adaptivesched*"]

[tool.setuptools.package-data]
adaptivesched = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
